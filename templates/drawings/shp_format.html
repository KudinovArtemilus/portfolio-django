<svg viewBox="0 14 400 198" role="img" aria-labelledby="shpf-title">
    <title id="shpf-title">Устройство файла .shp: заголовок 892 байта, таблица имён по 256 байт на сигнал и отсчёты по 1264 байта; один отсчёт — время uint32, 32 байта битов и float32 на каждый аналоговый сигнал</title>
    <defs>
        <marker id="arrow-shpf" viewBox="0 0 10 10" refX="10" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" class="arrow-head"/>
        </marker>
    </defs>

    <!-- Файл целиком: заголовок | имена | отсчёты -->
    <rect class="wheel-part module" x="20" y="46" width="40" height="24" pathLength="1"/>
    <rect class="wheel-part module" x="60" y="46" width="110" height="24" pathLength="1" style="animation-delay: .1s"/>
    <rect class="wheel-part module" x="170" y="46" width="218" height="24" pathLength="1" style="animation-delay: .2s"/>
    <path class="wheel-part wheel-thin" d="M214 46 V70 M236 46 V70 M258 46 V70 M280 46 V70 M302 46 V70 M324 46 V70 M346 46 V70 M368 46 V70" pathLength="1" style="animation-delay: .6s"/>
    <path class="wheel-part wheel-thin" d="M192 46 V70" pathLength="1" style="animation-delay: .6s"/>
    <rect class="wheel-part accent-line" x="192" y="46" width="22" height="24" pathLength="1" style="animation-delay: .9s"/>

    <!-- Размеры частей -->
    <line class="extension late" x1="20" y1="34" x2="20" y2="46"/>
    <line class="extension late" x1="60" y1="34" x2="60" y2="46"/>
    <line class="extension late" x1="170" y1="34" x2="170" y2="46"/>
    <line class="extension late" x1="388" y1="34" x2="388" y2="46"/>
    <g class="late">
        <line class="dimension" x1="20" y1="38" x2="60" y2="38" marker-start="url(#arrow-shpf)" marker-end="url(#arrow-shpf)"/>
        <line class="dimension" x1="60" y1="38" x2="170" y2="38" marker-start="url(#arrow-shpf)" marker-end="url(#arrow-shpf)"/>
        <line class="dimension" x1="170" y1="38" x2="388" y2="38" marker-start="url(#arrow-shpf)" marker-end="url(#arrow-shpf)"/>
    </g>

    <!-- Выноски: заголовок и один отсчёт -->
    <path class="extension late" d="M20 70 V104 M60 70 L150 104" fill="none" stroke-dasharray="3 3"/>
    <path class="extension late accent-line" d="M192 70 L178 104 M214 70 L388 104" fill="none" stroke-dasharray="3 3"/>

    <!-- Заголовок крупно -->
    <rect class="wheel-part module" x="20" y="104" width="130" height="68" rx="2" pathLength="1" style="animation-delay: 1.1s"/>
    <line class="wheel-part wheel-thin" x1="20" y1="118" x2="150" y2="118" pathLength="1" style="animation-delay: 1.3s"/>

    <!-- Отсчёт крупно: время | биты | float32 -->
    <rect class="wheel-part module" x="178" y="104" width="210" height="24" pathLength="1" style="animation-delay: 1.1s"/>
    <rect class="wheel-part module accent-line" x="178" y="104" width="36" height="24" pathLength="1" style="animation-delay: 1.3s"/>
    <line class="wheel-part" x1="256" y1="104" x2="256" y2="128" pathLength="1" style="animation-delay: 1.3s"/>
    <path class="wheel-part wheel-thin muted-line" d="M219.25 110 V122 M224.5 110 V122 M229.75 110 V122 M235 110 V122 M240.25 110 V122 M245.5 110 V122 M250.75 110 V122" pathLength="1" style="animation-delay: 1.5s"/>
    <path class="wheel-part wheel-thin" d="M273 104 V128 M290 104 V128 M307 104 V128 M324 104 V128 M341 104 V128 M358 104 V128 M375 104 V128" pathLength="1" style="animation-delay: 1.5s"/>
    <line class="extension late" x1="178" y1="128" x2="178" y2="172"/>
    <line class="extension late" x1="388" y1="128" x2="388" y2="172"/>
    <line class="dimension late" x1="178" y1="168" x2="388" y2="168" marker-start="url(#arrow-shpf)" marker-end="url(#arrow-shpf)"/>

    <!-- Проверка формата -->
    <path class="wheel-part accent-line" d="M20 199 L25 204 L35 192" pathLength="1" style="animation-delay: 2s"/>

    <g class="dimension-group">
        <text class="dimension-text" x="40" y="32" text-anchor="middle">892 Б</text>
        <text class="dimension-text" x="115" y="32" text-anchor="middle">563 × 256 Б</text>
        <text class="dimension-text" x="279" y="32" text-anchor="middle">n × 1264 Б</text>
        <text class="label-text" x="115" y="62" text-anchor="middle">имена сигналов</text>

        <text class="muted-text" x="85" y="114" text-anchor="middle">заголовок</text>
        <text class="label-text" x="28" y="134">0x08</text>
        <text class="muted-text" x="58" y="134">время, FILETIME</text>
        <text class="label-text" x="28" y="149">0x10</text>
        <text class="muted-text" x="58" y="149">дискретных: 256</text>
        <text class="label-text" x="28" y="164">0x2C</text>
        <text class="muted-text" x="58" y="164">аналоговых: 307</text>

        <text class="label-text" x="196" y="142" text-anchor="middle">время</text>
        <text class="muted-text" x="196" y="155" text-anchor="middle">uint32</text>
        <text class="label-text" x="235" y="142" text-anchor="middle">биты</text>
        <text class="muted-text" x="235" y="155" text-anchor="middle">32 Б</text>
        <text class="label-text" x="322" y="142" text-anchor="middle">float32 × 307</text>
        <text class="muted-text" x="322" y="155" text-anchor="middle">4 Б на сигнал</text>
        <text class="dimension-text" x="283" y="182" text-anchor="middle">1 отсчёт = 4 + 32 + 307 × 4 = 1264 Б</text>

        <text class="label-text" x="42" y="203">(файл − 892 − имена) ÷ 1264 — без остатка на всех образцах</text>
    </g>
</svg>
