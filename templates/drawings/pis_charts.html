<svg viewBox="0 0 400 270" role="img" aria-labelledby="pis-title">
    <title id="pis-title">Схема: выбор параметров и построение трендов с границами ±3σ</title>
    <defs>
        <marker id="arrow-pis" viewBox="0 0 10 10" refX="10" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" class="arrow-head"/>
        </marker>
    </defs>

    <!-- Список параметров -->
    <rect class="wheel-part module" x="10" y="62" width="112" height="28" rx="3" pathLength="1"/>
    <rect class="wheel-part module" x="10" y="100" width="112" height="28" rx="3" pathLength="1" style="animation-delay: .1s"/>
    <rect class="wheel-part module" x="10" y="138" width="112" height="28" rx="3" pathLength="1" style="animation-delay: .2s"/>
    <rect class="wheel-part module" x="10" y="176" width="112" height="28" rx="3" pathLength="1" style="animation-delay: .3s"/>

    <rect class="wheel-part wheel-thin" x="20" y="70" width="12" height="12" rx="2" pathLength="1" style="animation-delay: .4s"/>
    <rect class="wheel-part wheel-thin" x="20" y="108" width="12" height="12" rx="2" pathLength="1" style="animation-delay: .45s"/>
    <rect class="wheel-part wheel-thin" x="20" y="146" width="12" height="12" rx="2" pathLength="1" style="animation-delay: .5s"/>
    <rect class="wheel-part wheel-thin" x="20" y="184" width="12" height="12" rx="2" pathLength="1" style="animation-delay: .55s"/>

    <line class="wheel-part wheel-thin muted-line" x1="40" y1="76" x2="108" y2="76" pathLength="1" style="animation-delay: .5s"/>
    <line class="wheel-part wheel-thin muted-line" x1="40" y1="114" x2="96" y2="114" pathLength="1" style="animation-delay: .55s"/>
    <line class="wheel-part wheel-thin muted-line" x1="40" y1="152" x2="112" y2="152" pathLength="1" style="animation-delay: .6s"/>
    <line class="wheel-part wheel-thin muted-line" x1="40" y1="190" x2="88" y2="190" pathLength="1" style="animation-delay: .65s"/>

    <!-- Галочки у выбранных параметров -->
    <path class="wheel-part accent-line" d="M23 76 L26 79 L30 72" pathLength="1" style="animation-delay: .8s"/>
    <path class="wheel-part accent-line" d="M23 152 L26 155 L30 148" pathLength="1" style="animation-delay: .9s"/>

    <!-- Выбранные параметры идут на график -->
    <path class="wheel-part wheel-thin" d="M122 76 C142 76 140 132 158 132" pathLength="1" style="animation-delay: 1s"/>
    <path class="wheel-part wheel-thin" d="M122 152 C142 152 140 132 158 132" pathLength="1" style="animation-delay: 1s"/>
    <path class="late flow-head" d="M156 127 L166 132 L156 137 z"/>

    <!-- Оси графика -->
    <path class="wheel-part" d="M172 36 V222 H360" pathLength="1" style="animation-delay: .2s"/>
    <line class="wheel-part wheel-thin" x1="168" y1="80" x2="172" y2="80" pathLength="1" style="animation-delay: .6s"/>
    <line class="wheel-part wheel-thin" x1="168" y1="130" x2="172" y2="130" pathLength="1" style="animation-delay: .6s"/>
    <line class="wheel-part wheel-thin" x1="168" y1="180" x2="172" y2="180" pathLength="1" style="animation-delay: .6s"/>
    <line class="wheel-part wheel-thin" x1="220" y1="222" x2="220" y2="226" pathLength="1" style="animation-delay: .6s"/>
    <line class="wheel-part wheel-thin" x1="268" y1="222" x2="268" y2="226" pathLength="1" style="animation-delay: .6s"/>
    <line class="wheel-part wheel-thin" x1="316" y1="222" x2="316" y2="226" pathLength="1" style="animation-delay: .6s"/>

    <!-- Границы допуска -->
    <line class="centerline" x1="172" y1="72" x2="360" y2="72"/>
    <line class="centerline" x1="172" y1="192" x2="360" y2="192"/>

    <!-- Тренды двух параметров -->
    <path class="wheel-part" d="M178 138 L192 128 L206 134 L220 120 L234 130 L248 124 L262 136 L276 118 L290 126 L304 112 L318 82 L332 120 L346 128 L356 122" pathLength="1" style="animation-delay: 1.1s"/>
    <path class="wheel-part accent-line" d="M178 168 L192 172 L206 160 L220 166 L234 158 L248 164 L262 154 L276 160 L290 150 L304 156 L318 132 L332 150 L346 146 L356 150" pathLength="1" style="animation-delay: 1.3s"/>

    <!-- Отмеченная деталь и размер ±3σ -->
    <g class="dimension-group">
        <line class="extension" x1="318" y1="82" x2="318" y2="222" stroke-dasharray="3 3"/>
        <circle class="point" cx="318" cy="82" r="6"/>
        <line class="extension" x1="360" y1="72" x2="382" y2="72"/>
        <line class="extension" x1="360" y1="192" x2="382" y2="192"/>
        <line class="dimension" x1="376" y1="72" x2="376" y2="192"
              marker-start="url(#arrow-pis)" marker-end="url(#arrow-pis)"/>
        <text class="dimension-text" x="392" y="132" text-anchor="middle"
              transform="rotate(-90 392 132)">±3σ</text>
    </g>
</svg>
