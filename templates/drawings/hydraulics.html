<svg viewBox="0 20 400 195" role="img" aria-labelledby="hyd-title">
    <title id="hyd-title">Схема: насос, давление и ток, цилиндр с энкодером; время хода оси растёт по месяцам и выходит из нормы</title>

    <!-- Бак -->
    <path class="wheel-part" d="M20 150 V190 H90 V150" pathLength="1"/>
    <line class="wheel-part wheel-thin muted-line" x1="26" y1="166" x2="84" y2="166" pathLength="1" style="animation-delay: .2s"/>

    <!-- Насос и двигатель -->
    <circle class="wheel-part module" cx="55" cy="112" r="16" pathLength="1" style="animation-delay: .3s"/>
    <path class="wheel-part wheel-thin" d="M55 99 L64 112 L46 112 Z" pathLength="1" style="animation-delay: .5s"/>
    <line class="wheel-part wheel-thin" x1="55" y1="128" x2="55" y2="160" pathLength="1" style="animation-delay: .4s"/>
    <circle class="wheel-part module" cx="20" cy="112" r="10" pathLength="1" style="animation-delay: .35s"/>
    <line class="wheel-part wheel-thin" x1="30" y1="112" x2="39" y2="112" pathLength="1" style="animation-delay: .45s"/>

    <!-- Напорная и сливная линии -->
    <path class="wheel-part wheel-thin" d="M55 96 V60 H118" pathLength="1" style="animation-delay: .6s"/>
    <path class="wheel-part wheel-thin" d="M118 84 H80 V160" pathLength="1" style="animation-delay: .65s"/>

    <!-- Манометр -->
    <circle class="wheel-part wheel-thin module" cx="78" cy="42" r="8" pathLength="1" style="animation-delay: .7s"/>
    <line class="wheel-part wheel-thin" x1="78" y1="50" x2="78" y2="60" pathLength="1" style="animation-delay: .7s"/>
    <line class="wheel-part wheel-thin accent-line" x1="78" y1="42" x2="83" y2="37" pathLength="1" style="animation-delay: 1.4s"/>

    <!-- Цилиндр и шток -->
    <rect class="wheel-part module" x="118" y="52" width="72" height="40" rx="2" pathLength="1" style="animation-delay: .5s"/>
    <line class="wheel-part" x1="160" y1="54" x2="160" y2="90" pathLength="1" style="animation-delay: .8s"/>
    <line class="centerline" x1="110" y1="72" x2="232" y2="72"/>
    <line class="wheel-part" x1="160" y1="72" x2="222" y2="72" pathLength="1" style="animation-delay: .9s"/>

    <rect class="wheel-part accent-line module" x="216" y="58" width="16" height="28" rx="2" pathLength="1" style="animation-delay: 1s"/>
    <line class="wheel-part wheel-thin accent-line" x1="224" y1="86" x2="224" y2="120" pathLength="1" style="animation-delay: 1.1s"/>
    <path class="wheel-part wheel-thin accent-line" d="M224 120 H248" pathLength="1" style="animation-delay: 1.15s"/>

    <!-- График: время хода оси по месяцам -->
    <path class="wheel-part" d="M252 40 V180 H392" pathLength="1" style="animation-delay: .4s"/>
    <rect class="late norm-band" x="252" y="122" width="140" height="22"/>
    <path class="wheel-part accent-line" d="M262 134 L280 131 L298 136 L316 130 L334 124 L352 114 L370 98 L384 78" pathLength="1" style="animation-delay: 1.3s"/>

    <!-- Подписи -->
    <g class="dimension-group">
        <text class="label-text" x="55" y="206" text-anchor="middle">бак</text>
        <text class="label-text" x="44" y="146" text-anchor="end">насос</text>
        <text class="label-text" x="20" y="96" text-anchor="middle">I</text>
        <text class="label-text" x="92" y="40">P</text>
        <text class="label-text" x="154" y="106" text-anchor="middle">цилиндр</text>
        <text class="label-text" x="224" y="52" text-anchor="middle">энкодер</text>
        <circle class="point" cx="384" cy="78" r="4"/>
        <text class="muted-text" x="322" y="158" text-anchor="middle">норма</text>
        <text class="muted-text" x="322" y="196" text-anchor="middle">месяцы →</text>
        <text class="muted-text" x="248" y="34">время хода оси</text>
    </g>
</svg>
