<svg viewBox="0 8 400 262" role="img" aria-labelledby="pla-title">
    <title id="pla-title">Схема PLC Analyzer: три контроллера S7 передают данные анализатору, он показывает тренды в браузере и пишет файлы смен и паспорта циклов</title>
    <defs>
        <marker id="arrow-pla" viewBox="0 0 10 10" refX="10" refY="5"
                markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0 L10 5 L0 10 z" class="flow-head"/>
        </marker>
    </defs>

    <!-- Контроллеры -->
    <rect class="wheel-part module" x="10" y="24" width="74" height="44" rx="2" pathLength="1"/>
    <rect class="wheel-part module" x="10" y="113" width="74" height="44" rx="2" pathLength="1" style="animation-delay: .1s"/>
    <rect class="wheel-part module" x="10" y="202" width="74" height="44" rx="2" pathLength="1" style="animation-delay: .2s"/>
    <line class="wheel-part wheel-thin" x1="30" y1="24" x2="30" y2="68" pathLength="1" style="animation-delay: .3s"/>
    <line class="wheel-part wheel-thin" x1="30" y1="113" x2="30" y2="157" pathLength="1" style="animation-delay: .35s"/>
    <line class="wheel-part wheel-thin" x1="30" y1="202" x2="30" y2="246" pathLength="1" style="animation-delay: .4s"/>

    <!-- Опрос: по одному соединению на ПЛК -->
    <path class="wheel-part wheel-thin accent-line" d="M84 46 C120 46 112 112 150 112" pathLength="1" style="animation-delay: .6s"/>
    <path class="wheel-part wheel-thin accent-line" d="M84 135 H150" pathLength="1" style="animation-delay: .65s"/>
    <path class="wheel-part wheel-thin accent-line" d="M84 224 C120 224 112 158 150 158" pathLength="1" style="animation-delay: .7s"/>
    <path class="go-flow" d="M84 46 C120 46 112 112 150 112"/>
    <path class="go-flow" d="M84 135 H150"/>
    <path class="go-flow" d="M84 224 C120 224 112 158 150 158"/>

    <!-- Анализатор -->
    <rect class="wheel-part module" x="150" y="96" width="100" height="78" rx="6" pathLength="1" style="animation-delay: .5s"/>
    <line class="wheel-part wheel-thin" x1="150" y1="118" x2="250" y2="118" pathLength="1" style="animation-delay: .8s"/>

    <!-- Анализатор → браузер -->
    <path class="wheel-part wheel-thin accent-line" d="M250 116 C272 116 266 66 286 66" pathLength="1" style="animation-delay: .9s"/>
    <path class="go-flow" d="M250 116 C272 116 266 66 286 66"/>

    <!-- Браузер: дорожки трендов -->
    <rect class="wheel-part module" x="286" y="18" width="104" height="96" rx="3" pathLength="1" style="animation-delay: .7s"/>
    <line class="wheel-part wheel-thin" x1="286" y1="32" x2="390" y2="32" pathLength="1" style="animation-delay: .9s"/>
    <path class="wheel-part wheel-thin" d="M294 54 H312 V44 H336 V54 H352 V44 H382" pathLength="1" style="animation-delay: 1.1s"/>
    <path class="wheel-part wheel-thin accent-line" d="M294 78 L306 74 L318 79 L330 72 L342 76 L354 70 L366 62 L382 56" pathLength="1" style="animation-delay: 1.2s"/>
    <path class="wheel-part wheel-thin" d="M294 102 H320 V94 H326 V102 H358 V94 H364 V102 H382" pathLength="1" style="animation-delay: 1.3s"/>
    <line class="extension late" x1="330" y1="36" x2="330" y2="110" stroke-dasharray="3 3"/>
    <line class="extension late" x1="366" y1="36" x2="366" y2="110" stroke-dasharray="3 3"/>

    <!-- Анализатор → файлы смен -->
    <path class="wheel-part wheel-thin" d="M250 156 C272 156 266 206 292 206" pathLength="1" marker-end="url(#arrow-pla)" style="animation-delay: 1s"/>

    <!-- Файлы смен и паспорта -->
    <rect class="wheel-part module" x="306" y="168" width="64" height="44" rx="2" pathLength="1" style="animation-delay: 1.1s"/>
    <rect class="wheel-part module" x="300" y="176" width="64" height="44" rx="2" pathLength="1" style="animation-delay: 1.15s"/>
    <rect class="wheel-part module" x="294" y="184" width="64" height="44" rx="2" pathLength="1" style="animation-delay: 1.2s"/>
    <rect class="wheel-part module accent-line" x="294" y="236" width="64" height="24" rx="2" pathLength="1" style="animation-delay: 1.4s"/>

    <g class="dimension-group">
        <circle class="go-led" cx="20" cy="34" r="2.5"/>
        <circle class="go-led" cx="20" cy="123" r="2.5" style="animation-delay: .4s"/>
        <circle class="go-led" cx="20" cy="212" r="2.5" style="animation-delay: .8s"/>
        <text class="label-text" x="57" y="50" text-anchor="middle">S7-300</text>
        <text class="label-text" x="57" y="139" text-anchor="middle">S7-1200</text>
        <text class="label-text" x="57" y="228" text-anchor="middle">S7-1500</text>
        <text class="muted-text" x="117" y="128" text-anchor="middle">S7comm</text>

        <text class="muted-text" x="200" y="111" text-anchor="middle">plc-analyzer.exe</text>
        <text class="label-text" x="200" y="140" text-anchor="middle">сбор · запись</text>
        <text class="label-text" x="200" y="156" text-anchor="middle">аварии · циклы</text>
        <text class="muted-text" x="200" y="190" text-anchor="middle">служба Windows · Go</text>

        <circle class="ide-dot" cx="293" cy="25" r="2"/>
        <circle class="ide-dot" cx="300" cy="25" r="2"/>
        <text class="muted-text" x="347" y="28" text-anchor="middle">Live</text>
        <text class="muted-text" x="337" y="128" text-anchor="middle">браузер · любой ПК</text>

        <text class="label-text" x="326" y="210" text-anchor="middle">смена А</text>
        <text class="muted-text" x="326" y="222" text-anchor="middle">.pla</text>
        <text class="label-text" x="326" y="252" text-anchor="middle">паспорт</text>
    </g>
</svg>
