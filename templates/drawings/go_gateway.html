<svg viewBox="0 12 400 194" role="img" aria-labelledby="go-title">
    <title id="go-title">Окно редактора с кодом на Go: для каждого контроллера запускается горутина, данные идут с трёх ПЛК</title>

    <!-- Окно IDE -->
    <rect class="wheel-part module" x="10" y="20" width="236" height="170" rx="4" pathLength="1"/>
    <line class="wheel-part wheel-thin" x1="10" y1="38" x2="246" y2="38" pathLength="1" style="animation-delay: .2s"/>
    <line class="wheel-part wheel-thin muted-line" x1="34" y1="38" x2="34" y2="190" pathLength="1" style="animation-delay: .3s"/>

    <g class="dimension-group">
        <circle class="ide-dot" cx="21" cy="29" r="3"/>
        <circle class="ide-dot" cx="31" cy="29" r="3"/>
        <circle class="ide-dot" cx="41" cy="29" r="3"/>
        <text class="muted-text" x="128" y="32" text-anchor="middle">gateway.go</text>
    </g>

    <!-- Номера строк -->
    <g class="dimension-group">
        <text class="code-num" x="28" y="56">1</text>
        <text class="code-num" x="28" y="72">2</text>
        <text class="code-num" x="28" y="88">3</text>
        <text class="code-num" x="28" y="104">4</text>
        <text class="code-num" x="28" y="120">5</text>
        <text class="code-num" x="28" y="136">6</text>
        <text class="code-num" x="28" y="152">7</text>
        <text class="code-num" x="28" y="168">8</text>
    </g>

    <!-- Код печатается построчно -->
    <text class="code-line" x="42" y="56" style="animation-delay: 1.0s"><tspan class="code-kw">package</tspan> main</text>
    <text class="code-line" x="42" y="88" style="animation-delay: 1.2s"><tspan class="code-kw">func</tspan> main() {</text>
    <text class="code-line" x="54" y="104" style="animation-delay: 1.4s"><tspan class="code-kw">for</tspan> _, plc := <tspan class="code-kw">range</tspan> plcs {</text>
    <text class="code-line" x="66" y="120" style="animation-delay: 1.6s"><tspan class="code-go">go</tspan> poll(plc)</text>
    <text class="code-line" x="54" y="136" style="animation-delay: 1.8s">}</text>
    <text class="code-line" x="54" y="152" style="animation-delay: 2.0s">store.Run()</text>
    <text class="code-line" x="42" y="168" style="animation-delay: 2.2s">}</text>
    <rect class="code-caret" x="52" y="160" width="6" height="11"/>

    <!-- Подсветка строки с горутинами -->
    <rect class="code-highlight" x="35" y="110" width="210" height="15"/>

    <!-- Горутины: от строки go poll(plc) к контроллерам -->
    <path class="wheel-part wheel-thin accent-line" d="M246 117 C276 117 270 50 300 50" pathLength="1" style="animation-delay: 2.0s"/>
    <path class="wheel-part wheel-thin accent-line" d="M246 117 H300" pathLength="1" style="animation-delay: 2.1s"/>
    <path class="wheel-part wheel-thin accent-line" d="M246 117 C276 117 270 184 300 184" pathLength="1" style="animation-delay: 2.2s"/>
    <path class="go-flow" d="M300 50 C270 50 276 117 246 117"/>
    <path class="go-flow" d="M300 117 H246"/>
    <path class="go-flow" d="M300 184 C270 184 276 117 246 117"/>

    <!-- Контроллеры -->
    <rect class="wheel-part module" x="300" y="34" width="66" height="32" rx="2" pathLength="1" style="animation-delay: .4s"/>
    <rect class="wheel-part module" x="300" y="101" width="66" height="32" rx="2" pathLength="1" style="animation-delay: .5s"/>
    <rect class="wheel-part module" x="300" y="168" width="66" height="32" rx="2" pathLength="1" style="animation-delay: .6s"/>
    <g class="dimension-group">
        <circle class="go-led" cx="310" cy="44" r="2.5"/>
        <circle class="go-led" cx="310" cy="111" r="2.5" style="animation-delay: .4s"/>
        <circle class="go-led" cx="310" cy="178" r="2.5" style="animation-delay: .8s"/>
        <text class="label-text" x="338" y="55" text-anchor="middle">S7-300</text>
        <text class="label-text" x="338" y="122" text-anchor="middle">S7-1500</text>
        <text class="label-text" x="338" y="189" text-anchor="middle">Beckhoff</text>
        <text class="muted-text" x="240" y="184" text-anchor="end">3 горутины · опрос ПЛК</text>
    </g>
</svg>
