{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Артем Кудинов{% endblock %}</title>
    <meta name="description" content="{% block description %}Инженер-разработчик промышленных систем: мониторинг оборудования, отчёты и аналитика данных производства.{% endblock %}">

    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    <link rel="icon" href="{% static 'img/favicon-32.png' %}" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Артем Кудинов">
    <meta property="og:title" content="{% block og_title %}Артем Кудинов — инженер-разработчик{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Мониторинг оборудования, отчёты и аналитика данных производства.{% endblock %}">
    <meta property="og:url" content="https://portfolio-kudinov.vercel.app{{ request.path }}">
    <meta property="og:image" content="https://portfolio-kudinov.vercel.app{% static 'img/og.png' %}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body hx-boost="true">
    <header>
        <a href="{% url 'home' %}" class="logo">Артем Кудинов</a>
        <nav>
            <a href="{% url 'home' %}">Главная</a>
            <a href="{% url 'projects:list' %}">Проекты</a>
            <a href="{% url 'blog:list' %}">Блог</a>
            <a href="{% url 'about' %}">Обо мне</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>© 2026 Артем Кудинов</p>
    </footer>
</body>
</html>
